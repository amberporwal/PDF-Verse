# Render Blueprint: repo root me rakho, Render > New > Blueprint se connect karo
services:
  - type: web
    name: pdf-verse-api
    runtime: docker
    plan: starter        # LibreOffice ko ~1GB RAM chahiye; free (512MB) pe PPT/Word convert crash ho sakta hai
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: CLIENT_ORIGIN
        # Netlify site ka URL daalo (comma se multiple). Same-origin (Option 1) me zarurat nahi.
        value: https://your-site-name.netlify.app
      - key: MAX_FILE_MB
        value: "50"
